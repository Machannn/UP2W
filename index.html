<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Monitoring K3L</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Kaisei+Opti:wght@400;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Import File global.css External -->
  <link rel="stylesheet" href="global.css">

  <!-- Konfigurasi Tailwind Khusus -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ["Inter", "system-ui", "sans-serif"],
            kaisei: ["Kaisei Opti", "serif"],
          },
          colors: {
            'btn-masuk': '#4597b0', 
            'btn-tamu': '#8d8d8d',  
            'input-bg': '#e8e8e8',  
          }
        },
      },
    }
  </script>
</head>

<body class="relative min-h-screen flex items-center justify-center bg-gray-900 bg-cover bg-center" style="background-image: url('assets/bg/login-bg.png');">

  <!-- Overlay gelap -->
  <div class="absolute inset-0 bg-black/20"></div>

  <!-- Logo Kiri Atas -->
  <div class="absolute top-6 left-6 md:top-10 md:left-10 z-20">
    <img src="assets/logo/logo-danantara.png" alt="Danantara Indonesia" class="h-10 md:h-12" />
  </div>

  <!-- Logo Kanan Atas -->
  <div class="absolute top-6 right-6 md:top-10 md:right-10 z-20 flex gap-4">
    <img src="assets/logo/logo-pusharlis.png" alt="PLN Pusharlis" class="h-10 md:h-12" />
  </div>

  <!-- Container Card Login -->
  <div class="relative z-10 flex flex-col md:flex-row bg-white rounded-[24px] shadow-2xl max-w-[900px] w-full mx-4 overflow-hidden min-h-[500px]">

    <!-- Bagian Kiri -->
    <div class="hidden md:block w-1/2 bg-cover bg-center" style="background-image: url('assets/bg/login-cover.jpg');"></div>

    <!-- Bagian Kanan -->
    <div class="w-full md:w-1/2 p-10 md:p-14 flex flex-col items-center justify-center">

      <h1 class="text-3xl font-kaisei font-bold text-center text-black mb-10 leading-snug">
        Selamat Datang di<br>Website Monitoring K3L
      </h1>

      <div class="w-full max-w-[320px] space-y-4">
        
        <!-- Input Username / Email -->
        <input 
          type="text" 
          placeholder="Username / Email" 
          id="input-email"
          class="w-full bg-input-bg text-gray-600 rounded-full px-6 py-3 font-sans text-[15px] outline-none focus:ring-2 focus:ring-btn-masuk placeholder:opacity-50"
        />

        <!-- Input Password -->
        <input 
          type="password" 
          placeholder="Kata Sandi" 
          id="input-password"
          class="w-full bg-input-bg text-gray-600 rounded-full px-6 py-3 font-sans text-[15px] outline-none focus:ring-2 focus:ring-btn-masuk placeholder:opacity-50"
        />

        <!-- Area Tombol -->
        <div class="pt-6 flex flex-col gap-3 w-full">
          <button id="btn-login" class="w-full bg-btn-masuk hover:bg-[#357c92] text-white font-bold font-sans text-[17px] py-3 rounded-[10px] transition-colors shadow-md">
            Masuk
          </button>

          <div class="flex items-center w-full my-1">
            <div class="flex-grow border-t border-gray-400 opacity-50"></div>
            <span class="mx-4 text-gray-500 font-sans text-[14px]">atau</span>
            <div class="flex-grow border-t border-gray-400 opacity-50"></div>
          </div>

          <!-- Tombol Tamu -->
          <button id="btn-tamu" class="w-full bg-[#d4d4d4] hover:bg-[#b5b5b5] text-gray-800 font-sans text-[17px] py-3 rounded-[10px] transition-colors shadow-md">
            Masuk Sebagai Tamu
          </button>
        </div>

      </div>
    </div>
  </div>

  <!-- MODAL POP-UP GAGAL LOGIN -->
  <div id="modal-error" class="fixed inset-0 z-50 flex items-center justify-center hidden">
    <div id="modal-overlay" class="fixed inset-0 bg-black/50 backdrop-blur-sm animate-fade-in"></div>

    <div class="relative z-10 bg-white rounded-[24px] p-8 max-w-[380px] w-full mx-4 shadow-2xl flex flex-col items-center text-center animate-pop-in">
      
      <div class="w-20 h-20 bg-red-100 rounded-full flex items-center justify-center mb-5">
        <svg class="w-10 h-10 text-red-600" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </div>

      <h3 class="text-xl font-bold text-gray-900 mb-2">Gagal Login</h3>

      <p id="modal-error-text" class="text-gray-500 text-sm mb-6 leading-relaxed">
        Username atau Kata Sandi yang Anda masukkan salah.
      </p>

      <button id="btn-close-modal" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold font-sans py-3 rounded-[12px] transition-colors shadow-md">
        Coba Lagi
      </button>
    </div>
  </div>

  <!-- SCRIPT FIREBASE & LOGIKA LOGIN -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-analytics.js";
    // Ditambahkan signOut di import ini
    import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB0h60Mo9eDzhoobgHETjqJo4m_QG_rsqs",
      authDomain: "monitoring-k3l-24eb5.firebaseapp.com",
      projectId: "monitoring-k3l-24eb5",
      storageBucket: "monitoring-k3l-24eb5.firebasestorage.app",
      messagingSenderId: "264914059362",
      appId: "1:264914059362:web:9e8f6e8e1002322048913b",
      measurementId: "G-WFQHL8TF1G"
    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const auth = getAuth(app);

    const btnLogin = document.getElementById('btn-login');
    const btnTamu = document.getElementById('btn-tamu');
    const emailInput = document.getElementById('input-email');
    const passwordInput = document.getElementById('input-password');

    const modalError = document.getElementById('modal-error');
    const modalErrorText = document.getElementById('modal-error-text');
    const btnCloseModal = document.getElementById('btn-close-modal');
    const modalOverlay = document.getElementById('modal-overlay');

    function showErrorModal(message) {
      modalErrorText.innerText = message;
      modalError.classList.remove('hidden');
    }

    function hideErrorModal() {
      modalError.classList.add('hidden');
    }

    btnCloseModal.addEventListener('click', hideErrorModal);
    modalOverlay.addEventListener('click', hideErrorModal);

    // Login Masuk Akun Utama
    btnLogin.addEventListener('click', () => {
      // Hapus status tamu jika login resmi
      sessionStorage.removeItem('isGuest');

      const originalText = btnLogin.innerText;
      let userInput = emailInput.value.trim();
      const password = passwordInput.value;

      if (!userInput || !password) {
        showErrorModal("Username/Email dan Kata Sandi wajib diisi!");
        return;
      }

      let emailFinal = userInput.includes('@') ? userInput : `${userInput}@pusharlis.com`;

      btnLogin.innerText = "Memproses...";
      btnLogin.disabled = true;

      signInWithEmailAndPassword(auth, emailFinal, password)
        .then((userCredential) => {
          window.location.href = "dashboard.html";
        })
        .catch((error) => {
          const errorCode = error.code;
          if (errorCode === 'auth/invalid-credential') {
            showErrorModal("Username atau Kata Sandi yang Anda masukkan salah. Silakan periksa kembali.");
          } else {
            showErrorModal("Terjadi kesalahan saat login: " + error.message);
          }
          
          btnLogin.innerText = originalText;
          btnLogin.disabled = false;
        });
    });

    passwordInput.addEventListener('keyup', (e) => {
      if (e.key === 'Enter') {
        btnLogin.click();
      }
    });

    // Logika Tombol Masuk Sebagai Tamu (Sudah Diperbarui)
    btnTamu.addEventListener('click', async () => {
      sessionStorage.setItem('isGuest', 'true');
      try {
        await signOut(auth); // Memutus sesi akun Superadmin/lainnya yang tersisa
      } catch (e) {
        console.log(e);
      }
      window.location.href = "dashboard.html";
    });
  </script>
</body>
</html>

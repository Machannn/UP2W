<div class="sec-tabel fade-in">
  <div class="flex flex-col sm:flex-row justify-between items-center mb-6 gap-4">
    <h2 class="text-3xl font-bold text-black">Pompa Hydrant</h2>
    <div class="flex items-center gap-3 w-full sm:w-auto">
      <div class="relative w-full sm:w-64">
        <input type="text" id="search-pompahydrant" placeholder="Cari Kode, Nama, Bulan..." class="w-full bg-white border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-[#095a79] focus:border-[#095a79] block pl-10 p-2.5 outline-none shadow-sm transition-all" />
        <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
          <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        </div>
      </div>
      <button id="btn-tambah-pompahydrant" class="bg-[#095a79] hover:bg-[#117196] text-white font-semibold px-5 py-2.5 rounded-lg transition-colors shadow-sm hidden whitespace-nowrap">Tambah Pompa Hydrant</button>
    </div>
  </div>

  <div class="overflow-x-auto border border-gray-200 rounded-xl shadow-sm">
    <table class="w-full text-left border-collapse">
      <thead class="bg-[#d2e5ed] text-gray-900 text-sm font-bold">
        <tr>
          <th class="p-4 text-center cursor-pointer hover:bg-[#b8d4e0] transition-colors select-none" onclick="sortTabelCustom('pompahydrant', 'kode')">Kode Pompa Hydrant <span id="icon-sort-pompahydrant-kode" class="text-xs text-gray-600 ml-1">▲</span></th>
          <th class="p-4 text-center cursor-pointer hover:bg-[#b8d4e0] transition-colors select-none" onclick="sortTabelCustom('pompahydrant', 'pengawas')">Pengawas <span id="icon-sort-pompahydrant-pengawas" class="text-xs text-gray-600 ml-1"></span></th>
          <th class="p-4 text-center cursor-pointer hover:bg-[#b8d4e0] transition-colors select-none" onclick="sortTabelCustom('pompahydrant', 'petugas')">Petugas <span id="icon-sort-pompahydrant-petugas" class="text-xs text-gray-600 ml-1"></span></th>
          <th class="p-4 text-center cursor-pointer hover:bg-[#b8d4e0] transition-colors select-none" onclick="sortTabelCustom('pompahydrant', 'inspeksi')">Inspeksi Terakhir <span id="icon-sort-pompahydrant-inspeksi" class="text-xs text-gray-600 ml-1"></span></th>
          <th class="p-4 text-center">Bulan</th>
          <th class="p-4 text-center">Hasil Inspeksi</th>
          <th class="p-4 text-center col-aksi hidden">Aksi</th>
        </tr>
      </thead>
      <tbody id="tbody-pompahydrant" class="text-sm divide-y divide-gray-200 bg-white">
        <tr><td colspan="7" class="p-4 text-center text-gray-500">Memuat data Pompa Hydrant...</td></tr>
      </tbody>
    </table>
  </div>
</div>

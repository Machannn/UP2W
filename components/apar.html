<!-- ========================================== -->
<!-- BAGIAN TABEL APAR                          -->
<!-- ========================================== -->
<div class="sec-tabel fade-in">
  <div class="flex flex-col sm:flex-row justify-between items-center mb-6 gap-4">
    <h2 class="text-3xl font-bold text-black">APAR</h2>
    <div class="flex items-center gap-3 w-full sm:w-auto">
      
      <!-- Input Pencarian -->
      <div class="relative w-full sm:w-64">
        <input type="text" id="search-apar" placeholder="Cari Kode, Nama, Bulan..." class="w-full bg-white border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-[#095a79] focus:border-[#095a79] block pl-10 p-2.5 outline-none shadow-sm transition-all" />
        <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
          <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        </div>
      </div>
      
      <!-- Tombol Tambah (Disembunyikan jika bukan Superadmin) -->
      <button id="btn-tambah-apar" class="bg-[#095a79] hover:bg-[#117196] text-white font-semibold px-5 py-2.5 rounded-lg transition-colors shadow-sm hidden whitespace-nowrap">
        Tambah APAR
      </button>
    </div>
  </div>

  <!-- Tabel Data APAR -->
  <div class="overflow-x-auto border border-gray-200 rounded-xl shadow-sm">
    <table class="w-full text-left border-collapse">
      <thead class="bg-[#d2e5ed] text-gray-900 text-sm font-bold">
        <tr>
          <th class="p-4 text-center cursor-pointer hover:bg-[#b8d4e0] transition-colors select-none" onclick="sortTabelCustom('apar', 'kode')">Kode APAR <span id="icon-sort-apar-kode" class="text-xs text-gray-600 ml-1">▲</span></th>
          <th class="p-4 text-center cursor-pointer hover:bg-[#b8d4e0] transition-colors select-none" onclick="sortTabelCustom('apar', 'pengawas')">Pengawas <span id="icon-sort-apar-pengawas" class="text-xs text-gray-600 ml-1"></span></th>
          <th class="p-4 text-center cursor-pointer hover:bg-[#b8d4e0] transition-colors select-none" onclick="sortTabelCustom('apar', 'petugas')">Petugas <span id="icon-sort-apar-petugas" class="text-xs text-gray-600 ml-1"></span></th>
          <th class="p-4 text-center cursor-pointer hover:bg-[#b8d4e0] transition-colors select-none" onclick="sortTabelCustom('apar', 'inspeksi')">Inspeksi Terakhir <span id="icon-sort-apar-inspeksi" class="text-xs text-gray-600 ml-1"></span></th>
          <th class="p-4 text-center">Bulan</th>
          <th class="p-4 text-center">Hasil Inspeksi</th>
          <th class="p-4 text-center col-aksi hidden">Aksi</th>
        </tr>
      </thead>
      <tbody id="tbody-apar" class="text-sm divide-y divide-gray-200 bg-white">
        <tr><td colspan="7" class="p-4 text-center text-gray-500">Memuat data APAR...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- ========================================== -->
<!-- MODAL TAMBAH MASTER APAR                   -->
<!-- ========================================== -->
<div id="modal-tambah-apar" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center transition-opacity duration-300 opacity-0 pointer-events-none">
  <div id="modal-box-tambah-apar" class="bg-white rounded-xl shadow-xl w-full max-w-lg mx-4 overflow-hidden transform transition-all duration-300 scale-95 max-h-[90vh] flex flex-col">
    <div class="bg-[#095a79] text-white px-6 py-4 flex justify-between items-center flex-shrink-0">
      <h3 class="font-bold text-lg">Tambah Unit APAR</h3>
      <button type="button" id="btn-tutup-tambah-apar" class="text-white hover:text-gray-200 text-2xl font-bold">&times;</button>
    </div>

    <form id="form-tambah-apar" class="p-6 space-y-4 overflow-y-auto flex-1">
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Kode Unit</label>
        <input type="text" id="input-kode-apar" required placeholder="Contoh: APAR A1.001" class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-[#095a79] focus:border-[#095a79] p-2.5 outline-none shadow-sm uppercase" />
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Nama Pengawas</label>
        <input type="text" id="input-pengawas-apar" required placeholder="Ketik nama pengawas..." class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-[#095a79] focus:border-[#095a79] p-2.5 outline-none shadow-sm" />
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Titik Lokasi di Denah</label>
        <div id="denah-container-apar" class="relative w-full border border-gray-300 rounded-lg overflow-hidden cursor-crosshair bg-white flex justify-center items-center shadow-inner">
          <img src="assets/bg/denah-k3l.png" alt="Denah K3L" class="w-full h-auto object-contain pointer-events-none block" />
          <div id="pin-marker-apar" class="absolute w-4 h-4 bg-red-600 border-2 border-white rounded-full shadow-lg transform -translate-x-1/2 -translate-y-1/2 hidden pointer-events-none z-10"></div>
        </div>
        <input type="hidden" id="input-pos-x-apar" />
        <input type="hidden" id="input-pos-y-apar" />
      </div>

      <div class="flex justify-end gap-3 pt-4 border-t border-gray-200">
        <button type="button" id="btn-batal-tambah-apar" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold px-4 py-2 rounded-lg transition-colors text-sm">Batal</button>
        <button type="submit" class="bg-[#095a79] hover:bg-[#117196] text-white font-semibold px-5 py-2 rounded-lg transition-colors text-sm shadow-sm">Simpan Data</button>
      </div>
    </form>
  </div>
</div>

<!-- ========================================== -->
<!-- MODAL FORM INSPEKSI APAR                   -->
<!-- ========================================== -->
<div id="modal-inspeksi-apar" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300 z-50">
  <div id="modal-box-inspeksi-apar" class="bg-white rounded-2xl shadow-xl w-full max-w-2xl p-8 transform scale-95 transition-transform duration-300">
    
    <div class="mb-6">
      <h2 class="text-xl font-semibold text-gray-800 tracking-wide uppercase">FORM INSPEKSI ALAT K3L</h2>
      <h3 id="teks-judul-inspeksi-apar" class="text-lg text-gray-600 uppercase mt-1">APAR - KODE UNIT</h3>
    </div>
    
    <form id="form-inspeksi-apar" class="space-y-5">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
        <label class="text-base font-medium text-gray-900 w-full sm:w-1/3">Tanggal Pemeriksaan</label>
        <div class="w-full sm:w-2/3">
          <input type="date" id="input-tanggal-inspeksi-apar" required class="w-full bg-gray-200 text-gray-700 text-sm rounded-full px-4 py-2.5 outline-none focus:ring-2 focus:ring-[#095a79] transition-all cursor-pointer" />
        </div>
      </div>

      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
        <label class="text-base font-medium text-gray-900 w-full sm:w-1/3">Bulan Inspeksi</label>
        <div class="w-full sm:w-2/3">
          <input type="text" id="input-bulan-inspeksi-apar" readonly placeholder="Otomatis terisi..." class="w-full bg-gray-300 text-gray-600 font-semibold text-sm rounded-full px-4 py-2.5 outline-none cursor-not-allowed border border-transparent" />
        </div>
      </div>

      <hr class="border-gray-200 my-4">

      <div>
        <div class="grid grid-cols-12 items-center mb-4">
          <span class="col-span-6 font-semibold text-base text-gray-900">Kondisi Alat K3L</span>
          <div class="col-span-3 text-center"><span class="font-semibold text-base text-gray-900">Baik</span></div>
          <div class="col-span-3 text-center"><span class="font-semibold text-base text-gray-900">Tidak Baik</span></div>
        </div>
        
        <div class="space-y-4">
          <div class="grid grid-cols-12 items-center">
            <label class="col-span-6 text-base text-gray-800">Kondisi Fisik</label>
            <div class="col-span-3 flex justify-center"><input type="radio" name="apar_fisik" value="Baik" required class="w-5 h-5 accent-[#095a79] cursor-pointer"></div>
            <div class="col-span-3 flex justify-center"><input type="radio" name="apar_fisik" value="Tidak Baik" class="w-5 h-5 accent-black cursor-pointer"></div>
          </div>
          
          <div class="grid grid-cols-12 items-center">
            <label class="col-span-6 text-base text-gray-800">Pin / Segel / Kelengkapan</label>
            <div class="col-span-3 flex justify-center"><input type="radio" name="apar_segel" value="Baik" required class="w-5 h-5 accent-[#095a79] cursor-pointer"></div>
            <div class="col-span-3 flex justify-center"><input type="radio" name="apar_segel" value="Tidak Baik" class="w-5 h-5 accent-black cursor-pointer"></div>
          </div>
          
          <div class="grid grid-cols-12 items-center">
            <label class="col-span-6 text-base text-gray-800">Fungsi / Handle / Selang</label>
            <div class="col-span-3 flex justify-center"><input type="radio" name="apar_fungsi" value="Baik" required class="w-5 h-5 accent-[#095a79] cursor-pointer"></div>
            <div class="col-span-3 flex justify-center"><input type="radio" name="apar_fungsi" value="Tidak Baik" class="w-5 h-5 accent-black cursor-pointer"></div>
          </div>
        </div>
      </div>

      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mt-4">
        <label class="text-base font-medium text-gray-900 w-full sm:w-1/3">Pressure Gauge (Tekanan)</label>
        <div class="w-full sm:w-2/3 relative">
          <select id="input-pressure-apar" required class="w-full bg-gray-200 text-gray-700 text-sm rounded-full pl-4 pr-10 py-2.5 outline-none focus:ring-2 focus:ring-[#095a79] transition-all cursor-pointer appearance-none">
            <option value="" disabled selected>Pilih Status Tekanan</option>
            <option value="Normal">Normal (Hijau)</option>
            <option value="Turun">Turun (Merah Kiri)</option>
            <option value="Naik">Naik / Over (Merah Kanan)</option>
          </select>
          <div class="pointer-events-none absolute inset-y-0 right-4 flex items-center text-gray-600">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"/></svg>
          </div>
        </div>
      </div>

      <hr class="border-gray-200 my-4">

      <div class="flex justify-between items-center pt-2">
        <button type="reset" class="px-6 py-2 border-2 border-[#095a79] text-[#095a79] rounded-lg hover:bg-blue-50 transition-colors font-bold text-sm">Reset</button>
        <div class="flex gap-3">
          <button type="button" onclick="tutupModalInspeksiApar()" class="px-6 py-2 border-2 border-gray-400 text-gray-600 rounded-lg hover:bg-gray-50 transition-colors font-bold text-sm">Batal</button>
          <button type="submit" class="px-6 py-2 bg-[#095a79] text-white rounded-lg hover:bg-[#074760] transition-colors font-bold text-sm shadow-md">Kirim</button>
        </div>
      </div>
    </form>
  </div>
</div>

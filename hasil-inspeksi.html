<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Riwayat Hasil Inspeksi K3L</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
    /* Menghilangkan panah default details di browser */
    details > summary { list-style: none; }
    details > summary::-webkit-details-marker { display: none; }
  </style>
</head>
<body class="text-gray-800">

  <!-- Header & Navigasi -->
  <header class="bg-white shadow-sm sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <a href="dashboard.html" class="text-[#095a79] font-bold hover:underline flex items-center gap-2">
          <span>&larr; Kembali ke Dashboard</span>
        </a>
        <h1 class="text-xl font-bold border-l-2 border-gray-300 pl-4">Data Hasil Inspeksi</h1>
      </div>
      <!-- Info Login -->
      <div class="text-sm text-right">
        <div id="user-name" class="font-bold text-gray-800">Memuat...</div>
        <div id="user-role" class="text-[#095a79]">Memuat...</div>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8">
    
    <!-- Area Filter & Pencarian -->
    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 mb-8 flex flex-col sm:flex-row justify-between items-center gap-4">
      <div id="info-filter" class="text-lg font-semibold text-gray-700">
        Menampilkan Semua Hasil Inspeksi
      </div>
      
      <div class="flex flex-wrap gap-3 w-full sm:w-auto justify-end">
        <div class="relative w-full sm:w-64">
          <input type="text" id="search-inspeksi" placeholder="Cari kode, petugas, catatan..." class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 pl-10 outline-none focus:border-[#095a79] focus:ring-[#095a79]" />
          <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
            <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
          </div>
        </div>
        
        <button id="btn-reset-filter" class="bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 px-4 py-2 rounded-lg font-semibold hidden transition-colors whitespace-nowrap">
          Reset Filter
        </button>

        <!-- Tombol Tambah Inspeksi -->
        <button id="btn-tambah-inspeksi" class="bg-[#095a79] hover:bg-[#117196] text-white px-4 py-2 rounded-lg font-semibold transition-colors flex items-center gap-2 whitespace-nowrap hidden">
          <img src="assets/icon/icon-inspect.png" class="w-4 h-4 filter invert" alt="Add" />
          <span>Catat Inspeksi</span>
        </button>
      </div>
    </div>

    <!-- Kontainer Tabel Dropdown per Tahun -->
    <div id="container-tahun" class="space-y-6">
      <div class="text-center text-gray-500 py-10">Memuat riwayat inspeksi...</div>
    </div>

  </main>

  <!-- MODAL TAMBAH DATA INSPEKSI -->
  <div id="modal-inspeksi" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300 z-50">
    <div id="modal-box-inspeksi" class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 transform scale-95 transition-transform duration-300">
      <div class="flex justify-between items-center mb-4 border-b pb-3">
        <h3 class="text-xl font-bold text-gray-900">Form Laporan Inspeksi</h3>
        <button id="btn-tutup-modal" class="text-gray-400 hover:text-gray-600 font-bold text-xl">&times;</button>
      </div>
      
      <form id="form-tambah-inspeksi" class="space-y-4">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Kategori Modul</label>
            <input type="text" id="input-inspeksi-modul" readonly class="w-full bg-gray-100 border border-gray-300 text-gray-600 font-bold text-sm rounded-lg p-2.5 outline-none cursor-not-allowed uppercase" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Kode Unit</label>
            <input type="text" id="input-inspeksi-kode" readonly class="w-full bg-gray-100 border border-gray-300 text-gray-600 font-bold text-sm rounded-lg p-2.5 outline-none cursor-not-allowed uppercase" />
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Tanggal Inspeksi</label>
          <input type="date" id="input-inspeksi-tanggal" required class="w-full bg-white border border-gray-300 text-gray-900 text-sm rounded-lg p-2.5 outline-none focus:ring-[#095a79] focus:border-[#095a79]" />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Kondisi / Status</label>
          <select id="input-inspeksi-status" required class="w-full bg-white border border-gray-300 text-gray-900 text-sm rounded-lg p-2.5 outline-none focus:ring-[#095a79] focus:border-[#095a79]">
            <option value="Aman / Layak">Aman / Layak Pakai</option>
            <option value="Perlu Perbaikan">Perlu Perbaikan / Isi Ulang</option>
            <option value="Rusak">Rusak</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Catatan Tambahan (Opsional)</label>
          <textarea id="input-inspeksi-catatan" rows="2" placeholder="Contoh: Tekanan gas menurun..." class="w-full bg-white border border-gray-300 text-gray-900 text-sm rounded-lg p-2.5 outline-none focus:ring-[#095a79] focus:border-[#095a79]"></textarea>
        </div>

        <div class="flex justify-end gap-3 mt-6 pt-4 border-t">
          <button type="button" id="btn-batal-modal" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition-colors font-semibold">Batal</button>
          <button type="submit" id="btn-simpan-inspeksi" class="px-4 py-2 bg-[#095a79] text-white rounded-lg hover:bg-[#117196] transition-colors font-semibold">Simpan Laporan</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="hasil-inspeksi.js"></script>
</body>
</html>
